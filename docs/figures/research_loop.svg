<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs>
<rect width="1180" height="300" fill="white"/>
<text x="20" y="34" font-size="18" font-weight="700" fill="#1f2937">The research loop: 158 experiments, one change per cloud run, every verdict written down</text>
<rect x="20" y="70" width="170" height="100" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="105.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Hypothesis</text>
<text x="105.0" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">from the journal, the data,</text>
<text x="105.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">or an agent survey</text>
<line x1="190" y1="120" x2="215" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="215" y="70" width="170" height="100" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="300.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Cheap measurement</text>
<text x="300.0" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">fold 2, cached members,</text>
<text x="300.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">seconds per idea</text>
<line x1="385" y1="120" x2="410" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="410" y="70" width="170" height="100" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="495.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">The bar</text>
<text x="495.0" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">strong alone (0.57+)</text>
<text x="495.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">+0.003 on a plateau</text>
<line x1="580" y1="120" x2="605" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="605" y="70" width="170" height="100" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="690.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Streaming build</text>
<text x="690.0" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">library module verified</text>
<text x="690.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">against the batch matrix</text>
<line x1="775" y1="120" x2="800" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="800" y="70" width="170" height="100" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="885.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Ship</text>
<text x="885.0" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">assembler width checks</text>
<text x="885.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">verifier, one script</text>
<line x1="970" y1="120" x2="995" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="995" y="70" width="170" height="100" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="1080.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Cloud, then journal</text>
<text x="1080.0" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">one change per run</text>
<text x="1080.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">verdict and reason</text>
<path d="M 1105 170 C 1105 240, 105 240, 105 172" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="590" y="262" text-anchor="middle" font-size="12" fill="#6b7280">what transferred to the platform, and what did not, rewrites the bar for the next hypothesis</text>
</svg>