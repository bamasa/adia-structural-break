<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs>
<rect width="1180" height="420" fill="white"/>
<text x="20" y="34" font-size="18" font-weight="700" fill="#1f2937">The shipped ensemble (#45): one score per step, from six readers of the same stream</text>
<rect x="20" y="70" width="180" height="110" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="110.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">The series</text>
<text x="110.0" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">history 1,000–5,000 points</text>
<text x="110.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">online part, one point at a time</text>
<text x="110.0" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">z-scored on the history</text>
<rect x="250" y="60" width="200" height="130" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="350.0" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">206 streaming channels</text>
<text x="350.0" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">CUSUM, Page–Hinkley, variance ratio</text>
<text x="350.0" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">multi-scale, retrospective scans</text>
<text x="350.0" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">forecaster error, spectra, BOCPD</text>
<rect x="250" y="230" width="200" height="130" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="350.0" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">The whitened stream</text>
<text x="350.0" y="274" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">AR(p) by BIC, conditional scale,</text>
<text x="350.0" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">innovation ECDF → normal scores</text>
<text x="350.0" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">90 statistics + 21 SR odds + context</text>
<rect x="500" y="40" width="200" height="90" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="600.0" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Core trees</text>
<text x="600.0" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">LightGBM ranker (augmented)</text>
<text x="600.0" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">and classifier, per step</text>
<rect x="500" y="150" width="200" height="90" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="600.0" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Core networks</text>
<text x="600.0" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">24 dilated causal TCNs</text>
<text x="600.0" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">over channel trajectories</text>
<rect x="500" y="260" width="200" height="110" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="600.0" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Whitened member</text>
<text x="600.0" y="304" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">two per-step rankers + classifier</text>
<text x="600.0" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">(0.63 alone on the fold)</text>
<text x="600.0" y="336" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">3 TCNs over whitened channels</text>
<rect x="750" y="150" width="200" height="110" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="850.0" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Independent members</text>
<text x="850.0" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">mass battery (90 statistics)</text>
<text x="850.0" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">frequency/dependence + novelty</text>
<text x="850.0" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">joint TCNs over 200 + 111 channels</text>
<text x="850.0" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">(a reader of both streams)</text>
<rect x="1000" y="150" width="160" height="110" rx="10" fill="#ecfeff" stroke="#1f2937" stroke-width="1.5"/>
<text x="1080.0" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Hand blend</text>
<text x="1080.0" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">shares read on an</text>
<text x="1080.0" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">untouched fold</text>
<text x="1080.0" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">→ score in [0, 1]</text>
<line x1="200" y1="125" x2="250" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="200" y1="125" x2="250" y2="295" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
