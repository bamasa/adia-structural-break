<line x1="450" y1="295" x2="500" y2="310" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="140" x2="750" y2="200" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="290" x2="750" y2="215" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="700" y1="85" x2="1000" y2="190" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="700" y1="195" x2="1000" y2="200" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="700" y1="315" x2="1000" y2="215" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="950" y1="205" x2="1000" y2="205" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
</svg>