<rect width="1180" height="560" rx="16" fill="white"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#1f2937">The shipped ensemble (#45): one score per step, from five readers of two streams</text>
<text x="32" y="68" font-size="13" fill="#6b7280">Badges: each reader&#8217;s share of the final blend from step 100 on. Colour: which stream a reader is built on.</text>
<rect x="32" y="232" width="190" height="112" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="1.6"/>
<text x="48" y="258" font-size="15" font-weight="700" fill="#1f2937">The series</text>
<text x="48" y="279" font-size="12.5" fill="#6b7280">history: 1,000–5,000 points</text>
<text x="48" y="296" font-size="12.5" fill="#6b7280">online: one point at a time</text>
<text x="48" y="313" font-size="12.5" fill="#6b7280">z-scored on the history</text>
<rect x="290" y="120" width="260" height="128" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="306" y="146" font-size="15" font-weight="700" fill="#1f2937">Streaming channels</text>
<text x="306" y="167" font-size="12.5" fill="#6b7280">206 channels: CUSUM, Page–Hinkley,</text>
<text x="306" y="184" font-size="12.5" fill="#6b7280">variance ratios, multi-scale,</text>
<text x="306" y="201" font-size="12.5" fill="#6b7280">retrospective scans, spectra, BOCPD,</text>
<text x="306" y="218" font-size="12.5" fill="#6b7280">mass / frequency / novelty batteries</text>
<rect x="290" y="330" width="260" height="128" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="306" y="356" font-size="15" font-weight="700" fill="#1f2937">The whitened stream</text>
<text x="306" y="377" font-size="12.5" fill="#6b7280">AR(p) by BIC, conditional scale,</text>
<text x="306" y="394" font-size="12.5" fill="#6b7280">innovation ECDF → normal scores;</text>
<text x="306" y="411" font-size="12.5" fill="#6b7280">90 statistics, 21 Shiryaev–Roberts</text>
<text x="306" y="428" font-size="12.5" fill="#6b7280">odds, 8 history constants</text>
<rect x="640" y="96" width="330" height="70" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="656" y="122" font-size="15" font-weight="700" fill="#1f2937">Core trees</text>
<text x="656" y="143" font-size="12.5" fill="#6b7280">LightGBM ranker + classifier, per step</text>
<rect x="908" y="107" width="50" height="22" rx="11" fill="#0f766e"/><text x="933" y="122.5" text-anchor="middle" font-size="12" font-weight="700" fill="white">11%</text>
<rect x="640" y="184" width="330" height="70" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="656" y="210" font-size="15" font-weight="700" fill="#1f2937">Core networks</text>
<text x="656" y="231" font-size="12.5" fill="#6b7280">24 dilated causal TCNs over trajectories</text>
<rect x="908" y="195" width="50" height="22" rx="11" fill="#0f766e"/><text x="933" y="210.5" text-anchor="middle" font-size="12" font-weight="700" fill="white">13%</text>
<rect x="640" y="272" width="330" height="70" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="656" y="298" font-size="15" font-weight="700" fill="#1f2937">Independent members</text>
<text x="656" y="319" font-size="12.5" fill="#6b7280">mass battery; frequency + novelty</text>
<rect x="908" y="283" width="50" height="22" rx="11" fill="#0f766e"/><text x="933" y="298.5" text-anchor="middle" font-size="12" font-weight="700" fill="white">24%</text>
<rect x="640" y="360" width="330" height="70" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="656" y="386" font-size="15" font-weight="700" fill="#1f2937">Whitened member</text>
<text x="656" y="407" font-size="12.5" fill="#6b7280">2 per-step rankers + classifier, 3 TCNs</text>
<rect x="908" y="371" width="50" height="22" rx="11" fill="#b45309"/><text x="933" y="386.5" text-anchor="middle" font-size="12" font-weight="700" fill="white">42%</text>
<rect x="640" y="448" width="330" height="70" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="656" y="474" font-size="15" font-weight="700" fill="#1f2937">Joint networks</text>
<text x="656" y="495" font-size="12.5" fill="#6b7280">3 TCNs reading both streams together</text>
<rect x="908" y="459" width="50" height="22" rx="11" fill="#475569"/><text x="933" y="474.5" text-anchor="middle" font-size="12" font-weight="700" fill="white">10%</text>
<rect x="1020" y="236" width="140" height="104" rx="12" fill="#ecfeff" stroke="#1f2937" stroke-width="1.6"/>
<text x="1036" y="262" font-size="15" font-weight="700" fill="#1f2937">Hand blend</text>
<text x="1036" y="283" font-size="12.5" fill="#6b7280">shares read on</text>
<text x="1036" y="300" font-size="12.5" fill="#6b7280">an untouched fold</text>
<text x="1036" y="317" font-size="12.5" fill="#6b7280">→ score in [0, 1]</text>
