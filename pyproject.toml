[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structural-break"
version = "0.1.0"
description = "Streaming structural-break detection for univariate time series: whitening by the series' own history, sequential statistics and Shiryaev-Roberts odds, verified against batch builders"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
models = ["lightgbm>=4.0", "scikit-learn>=1.3", "pandas>=2.0", "joblib"]
nets = ["torch>=2.1"]
figures = ["matplotlib>=3.7", "pillow"]

[project.urls]
Homepage = "https://github.com/bamasa/adia-structural-break"
Competition = "https://hub.crunchdao.com/competitions/structural-break-real-time"

[tool.hatch.build.targets.wheel]
packages = ["src/structural_break"]
